name: Update daily snapshot

on:
  workflow_dispatch:
    inputs:
      force_notify:
        description: "发送测试微信推送（勾选后本次运行强制推送）"
        type: boolean
        default: false
  schedule:
    # GitHub Actions 的 cron 使用 UTC。22:30 UTC = 北京时间 06:30（次日）。
    # 美股 16:00 ET 收盘 ≈ 20:00~21:00 UTC，22:30 UTC 可确保收盘数据完整（夏令时/冬令时均覆盖）。
    - cron: "30 22 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch market data snapshot
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          NOTIFY_FORCE: ${{ github.event.inputs.force_notify || '' }}
        run: node scripts/fetch-daily.mjs

      - name: Commit and push snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json
          git diff --cached --quiet || git commit -m "chore: update daily market snapshot ($(date -u +%F))"
          git push
